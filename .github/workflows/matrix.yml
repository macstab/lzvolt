name: matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: ${{ matrix.libc }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.libc }}-${{ matrix.arch }}
        run: make docker-build-${{ matrix.libc }}-${{ matrix.arch }}
      - name: What came out
        run: |
          ls -la dist/
          file dist/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both slices are built on Apple silicon. `macos-13` was the obvious
          # host for the x86 one and it does not exist any more -- GitHub
          # retired it, so that job queued indefinitely rather than failing,
          # which is the worse of the two outcomes. Cross-compiling is fine:
          # the macOS SDK carries both architectures.
          - { os: macos-14, target: aarch64-apple-darwin, native: true }
          - { os: macos-14, target: x86_64-apple-darwin, native: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # `rust-toolchain.toml` pins the channel *and* its target list, and it
      # wins over the action's `targets:` input -- which is why this job failed
      # with "can't find crate for `std`" while the arm64 one passed: that one
      # is the host and was installed anyway. Adding it explicitly is what the
      # Dockerfiles already do.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Only where the runner can execute what it just built. The x86 slice is
      # covered by the Linux amd64 jobs, which run the same assembly.
      - if: matrix.native
        run: cargo test --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/liblzvolt.a
            target/${{ matrix.target }}/release/liblzvolt.dylib
          retention-days: 7

  windows:
    name: windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: amd64, native: true }
          - { target: aarch64-pc-windows-msvc, arch: arm64, native: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      # No assembly here: the kernels are GAS with ELF/Mach-O directives and
      # COFF will not take them, so Windows runs the portable decoder. It is
      # slower and it is correct, and the same tests prove it.
      - run: cargo build --release --target ${{ matrix.target }}
      - if: matrix.native
        run: cargo test --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/lzvolt.dll
            target/${{ matrix.target }}/release/lzvolt.dll.lib
            target/${{ matrix.target }}/release/lzvolt.lib
          retention-days: 7
          if-no-files-found: warn
