name: matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build:
    name: ${{ matrix.libc }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.libc }}-${{ matrix.arch }}
        run: make docker-build-${{ matrix.libc }}-${{ matrix.arch }}
      - name: What came out
        run: |
          ls -la dist/
          file dist/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/liblzvolt.a
            target/${{ matrix.target }}/release/liblzvolt.dylib
          retention-days: 7
