# The checks that are too slow to run on every change.
#
# Splitting these out is not a compromise, it is the only way they run at all.
# Miri interprets every operation: one test that takes a hundredth of a second
# natively took 2229 seconds under it. `make miri` in ci.yml runs the same
# tests at reduced volume on every change; this runs them at full size, weekly,
# where hours are acceptable.
name: deep

on:
  schedule:
    # Sunday, early. Nothing waits on this.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miri-full:
    name: miri at full size
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: make miri-full

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [decode_native, decode_lz4, roundtrip, decode_into]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Unseeded, a run spends its whole budget proving the header reader
      # rejects noise and never reaches the decode loop. The published vectors
      # are valid streams covering every branch the format has.
      - run: make fuzz-seed
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=3600 -print_final_stats=1
      # A crash leaves a reproducer behind. Keep it -- it is the input that
      # belongs in a regression test, and it is not reconstructable from the
      # log alone.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 90

  soak:
    name: interop soak, both architectures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblz4-dev
      # Thousands of liblz4-packed values through our kernel, byte for byte.
      # This is the check that found both of the assembly bugs in the log.
      - run: make soak

  cross:
    name: every released variant still builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      # So that a broken release pipeline is found on a Sunday and not by a tag.
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-dist
          path: dist/
          retention-days: 14
