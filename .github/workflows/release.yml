name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is published before the same checks a pull request has to pass.
  # A tag is not a reason to skip them; it is the reason not to.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblz4-dev
      - run: make check
      - name: The tag and Cargo.toml must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(make --no-print-directory version)"
          echo "tag=$tag  Cargo.toml=$crate"
          [ "$tag" = "$crate" ] || { echo "::error::tag $tag does not match Cargo.toml $crate"; exit 1; }

  linux:
    name: linux binaries
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build every variant
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          retention-days: 7

  macos:
    name: macos binaries
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        include:
          # macos-13 is retired; both slices cross-build on Apple silicon.
          - { os: macos-14, target: aarch64-apple-darwin, name: arm64 }
          - { os: macos-14, target: x86_64-apple-darwin,  name: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `rust-toolchain.toml` pins the channel *and* its target list, and it
      # wins over the action's `targets:` input -- which is why this job failed
      # with "can't find crate for `std`" while the arm64 one passed: that one
      # is the host and was installed anyway. Adding it explicitly is what the
      # Dockerfiles already do.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/liblzvolt.a \
             dist/liblzvolt-macos-${{ matrix.name }}.a
          cp target/${{ matrix.target }}/release/liblzvolt.dylib \
             dist/liblzvolt-macos-${{ matrix.name }}.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: dist/
          retention-days: 7

  windows:
    name: windows binaries ${{ matrix.arch }}
    runs-on: windows-latest
    needs: verify
    strategy:
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: amd64 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          t=target/${{ matrix.target }}/release
          for f in lzvolt.dll lzvolt.dll.lib lzvolt.lib; do
            [ -f "$t/$f" ] && cp "$t/$f" "dist/${f%.*}-windows-${{ matrix.arch }}.${f##*.}"
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  publish:
    name: publish the release
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Gather and checksum
        run: |
          mkdir -p dist
          find staged -type f \( -name 'liblzvolt-*' -o -name 'lzvolt*-windows-*' \
            -o -name 'lzvolt.h' -o -name 'lzvolt.pc' -o -name '*.cmake' \) \
            -exec cp {} dist/ \;
          cp include/lzvolt.h dist/
          cd dist && sha256sum * > SHA256SUMS
          echo "::group::SHA256SUMS"; cat SHA256SUMS; echo "::endgroup::"
      - name: Notes for this tag
        run: |
          # The section of CHANGELOG.md for this version, and nothing else.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; print; next }
            on && /^## \[/        { exit }
            on                     { print }
          ' CHANGELOG.md > NOTES.md
          test -s NOTES.md || echo "No changelog entry for $v." > NOTES.md
          cat NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # crates.io carries the Rust *source* crate and nothing else -- it does not
  # host binaries. The compiled libraries are the GitHub Release above.
  #
  # Skipped when no token is configured rather than failed. The two
  # destinations are independent: a release that publishes the C libraries and
  # not the crate is a perfectly good release, and turning a missing secret
  # into a red run after the Release is already public helps nobody.
  crates-io:
    name: crates.io
    runs-on: ubuntu-24.04
    needs: publish
    # Not for a prerelease tag, and not without a token.
    if: ${{ !contains(github.ref_name, '-') && secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # So that a skipped crates.io step is visible rather than silent.
  say-what-shipped:
    name: what shipped
    runs-on: ubuntu-24.04
    needs: [publish, crates-io]
    if: always() && needs.publish.result == 'success'
    steps:
      - name: Summary
        run: |
          {
            echo "### lzvolt ${GITHUB_REF_NAME} released"
            echo
            echo "- GitHub Release with the C libraries and header: **published**"
            if [ "${{ needs.crates-io.result }}" = "success" ]; then
              echo "- crates.io: **published**"
            else
              echo "- crates.io: **skipped** (no CARGO_REGISTRY_TOKEN secret)."
              echo "  Set it and re-run, or publish by hand with \`cargo publish\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
