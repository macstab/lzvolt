# cargo-deny. The interesting thing about this file is how little it has to
# say: the library has no runtime dependencies at all, so the dependency
# graph being audited is the dev-dependencies and nothing that ships.

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Apache-2.0 is this project's licence; the rest are what the benchmark and
# test dependencies use. Anything outside the list fails the build rather
# than being noticed later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
