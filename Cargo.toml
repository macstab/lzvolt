[package]
name = "keva-asm"
description = "Hand-written SIMD kernels for KevaVolt's hot paths, with runtime CPU dispatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { workspace = true }

[features]
default = ["asm"]
# Assembling the hand-written kernels can be turned off to fall back to the
# portable scalar reference. Useful when bringing up a new target, and it is
# what the differential tests compare against.
asm = []

[[bench]]
name = "ctrl_match"
harness = false
