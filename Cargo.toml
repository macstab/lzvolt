[package]
name = "lzvolt"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Christian Schnapka <5767180+nolem@users.noreply.github.com>"]
description = """\
LZ, variable. A byte-oriented LZ77 codec that chooses its token layout per \
value, with hand-written assembly kernels per CPU part line. Decodes 14-83% \
faster than LZ4 on every shape measured, packs smaller, and reads raw LZ4 \
blocks too. Rust and C."""
repository = "https://github.com/macstab/lzvolt"
homepage = "https://github.com/macstab/lzvolt"
documentation = "https://docs.rs/lzvolt"
readme = "README.md"
# Accurate, not aspirational: this crate uses `std` (Vec, thread_local), so no
# no-std category belongs here however tempting the badge is.
categories = ["compression", "algorithms", "encoding"]
keywords = ["compression", "lz77", "lz4", "simd", "assembly"]
# The measurement log is 120 KB of history a user does not need in their
# registry cache; the format spec and the test vectors they might.
exclude = ["bench-results/", "scripts/", "docs/MEASUREMENTS.md"]

# docs.rs builds with default features, which assembles the kernels -- it has a
# C compiler, so that works. `liblz4` stays off: it links a system library that
# docs.rs does not have, and nothing in the public API needs it.
[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[lib]
# rlib for Rust callers; the other two are what makes the C ABI usable from
# anything else. See include/lzvolt.h and src/ffi.rs.
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The third opinion in the comparison benchmarks. Pure Rust, so it costs nothing
# to have present even when the C library is not.
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[features]
default = ["asm"]
# Assembling the hand-written kernels can be turned off to fall back to the
# portable reference. Useful when bringing up a new target, and it is what the
# differential tests compare against.
asm = []
# Links the system liblz4, which the interop soak and the comparison benchmarks
# need. Not required to use the library.
liblz4 = []

# The comparison benchmarks and the interop soak link the system liblz4, so
# they only build when asked for it. Nothing in the library itself needs it.
[[bench]]
name = "codec"
harness = false
required-features = ["liblz4"]

[[bench]]
name = "kernel"
harness = false

[profile.release]
# The decoder's fixed cost per call is a third to a half of the work on a
# 512-byte value, so a call that survives across the crate boundary is a
# measurable loss to a caller. Both of these are what keeps the thin wrappers
# in lib.rs from becoming real calls.
lto = "fat"
codegen-units = 1

[[example]]
name = "soak"
required-features = ["liblz4"]

[[example]]
name = "census"
required-features = ["liblz4"]

[[example]]
name = "quick"
required-features = ["liblz4"]

[[example]]
name = "profile"
required-features = ["liblz4"]

[[example]]
name = "split_census"
